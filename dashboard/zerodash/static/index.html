<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Zero dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M9 22l5-7 4 4 5-9' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="titles">
      <h1 id="title">Zero dashboard</h1>
      <div class="sub" id="sub" aria-live="polite">Loading…</div>
    </div>
    <div class="top-actions">
      <button type="button" class="btn pause" id="pause-all" disabled>Pause all</button>
      <button type="button" class="btn resume" id="resume-all" disabled>Resume all</button>
    </div>
  </header>

  <section class="machine" id="machine" aria-label="Machine"></section>

  <div class="toolbar">
    <label class="toggle"><input type="checkbox" id="show-all"> <span>Show all runs</span> <span class="muted" id="hidden-count"></span></label>
    <span class="muted small" id="pa-note"></span>
  </div>

  <main id="projects"></main>
  <p class="foot muted small">Reads each run's files; Pause writes the run's PAUSE file, Resume removes it. STOP files are never touched.</p>
</div>

<div class="overlay" id="confirm" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <h2 id="confirm-title"></h2>
    <div id="confirm-body"></div>
    <div class="sheet-actions">
      <button type="button" class="btn ghost" id="confirm-cancel">Cancel</button>
      <button type="button" class="btn" id="confirm-ok"></button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="tip" id="tip" hidden></div>
<script src="static/app.js"></script>
</body>
</html>
