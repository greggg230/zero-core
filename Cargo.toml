[workspace]
resolver = "2"
members = ["crates/search", "crates/py", "crates/toy_py", "crates/webnet", "crates/worker"]
# `cargo test` / `cargo build` at the root: search + webnet (the PyO3 crates are built by
# tools/build_py.sh; a game builds them through its own workspace, docs/new_game.md; the native
# worker library crates/worker - ONNX Runtime - only when asked: `cargo test -p zero_worker`)
default-members = ["crates/search", "crates/webnet"]

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"
